name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check required files
        run: |
          set -euo pipefail
          test -s index.html
          test -s styles.css
          test -s script.js
          test -s assets/favicon.svg
          test -s assets/og-cover.svg
          test -s assets/profile-placeholder.svg
          test -s sitemap.xml
          test -s robots.txt
          grep -q '<html lang="es">' index.html
          grep -q 'id="contenido"' index.html
          grep -q 'id="proyectos"' index.html
          echo "Static site checks passed."

  deploy:
    name: Build and deploy
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
