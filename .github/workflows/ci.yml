name: Portfolio CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check required files
        run: |
          set -euo pipefail
          test -s index.html
          test -s styles.css
          test -s script.js
          test -s assets/favicon.svg
          test -s assets/og-cover.svg
          test -s assets/profile-placeholder.svg
          test -s sitemap.xml
          test -s robots.txt
          grep -q '<html lang="es">' index.html
          grep -q 'id="contenido"' index.html
          grep -q 'id="proyectos"' index.html
          grep -q 'https://portafolio-cal.pages.dev/' index.html
          echo "Static site checks passed."
